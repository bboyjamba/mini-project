<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav>
      <div class="logo">
        <img
          src="./assets/fes-logo.png"
          alt="fes logo"
          class="lol__img"
          width="50px"
        />
        <h1 class="logo__text"><b>Frontend</b> Simplified</h1>
      </div>
      <ul>
        <li><a href="#about">About</a></li>
        <li><a href="#social">Social</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
    <header>
      <div class="row row__course">
        <div class="course">
          <h1 class="course__icon">💾</h1>
          <div class="course__text">
            <div class="course__selection">----Your Course----</div>
            <div class="course__title">Software Engineering</div>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="hero">
          <figure class="hero__img--wrapper">
            <img src="./assets/laptop.png" alt="hero image" class="hero__img" />
          </figure>
          <div class="hero__description">
            <h1>Best place to learn frontend</h1>
            <p class="subheader">
              Go fromabsolute beginner to pro with simplified process.
            </p>
            <a href="#about">
              <button class="hero__description--button">▷ Learn More</button>
            </a>
          </div>
        </div>
      </div>
    </header>
  </body>
</html>
